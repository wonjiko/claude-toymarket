name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  # PR에서는 새 push가 앞선 실행을 취소해도 무해하다. main push는 취소하지
  # 않는다. 연달아 push하면 머지된 커밋의 검증이 끝나지 못한 채 죽는다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # pyyaml이 없으면 verify_repo.py가 frontmatter를 축약 파서로 읽고
      # YAML 유효성 검사(E302, E303)를 건너뛴다. 경고라서 실패하지 않으므로
      # 설치하지 않으면 그 검사는 상시 비활성인 채로 초록불이 된다.
      - name: Install pyyaml
        run: pip install pyyaml

      - name: Claude profile
        run: python scripts/verify_repo.py --profile claude --full

      - name: Dual profile
        run: python scripts/verify_repo.py --profile dual

      # git diff는 추적되지 않는 파일을 보지 않는다. --fix가 생성 파일을
      # 새로 만드는 경우를 잡으려면 porcelain 전체가 비어 있어야 한다.
      - name: Generated manifests are up to date
        run: |
          python scripts/verify_repo.py --profile dual --fix
          test -z "$(git status --porcelain)"

      - name: Lint plugin components
        run: ./plugins/matryoshka-plugin/scripts/lint-all.sh
